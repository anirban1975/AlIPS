<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlIPS Worksheet Generator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sheet.css">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <div class="brand-mark">∑</div>
      <div class="brand-text">
        <h1 data-i18n="schoolName"></h1>
        <p data-i18n="genSubtitle"></p>
      </div>
    </div>
    <div class="controls">
      <a href="index.html" class="lang-btn" data-i18n="backToCurriculum"></a>
      <button id="lang-toggle" class="lang-btn"></button>
    </div>
  </header>

  <div class="gen-layout">
    <aside class="gen-panel no-print">
      <div class="panel-group">
        <label data-i18n="mode"></label>
        <div class="view-toggle">
          <button id="mode-worksheet" class="toggle-btn active" data-i18n="modeWorksheet"></button>
          <button id="mode-exam" class="toggle-btn" data-i18n="modeExam"></button>
        </div>
      </div>

      <div class="panel-group">
        <label for="grade-select" data-i18n="gradeLabel"></label>
        <select id="grade-select"></select>
      </div>

      <div class="panel-group">
        <label data-i18n="topicsLabel"></label>
        <div id="topic-list" class="topic-checks"></div>
      </div>

      <div class="panel-group" id="worksheet-opts">
        <label for="q-count" data-i18n="questionsPerTopic"></label>
        <input id="q-count" type="number" min="1" max="30" value="6">
        <label for="difficulty" data-i18n="difficultyLabel"></label>
        <select id="difficulty">
          <option value="1" data-i18n="diffEasy"></option>
          <option value="2" selected data-i18n="diffMedium"></option>
          <option value="3" data-i18n="diffHard"></option>
        </select>
      </div>

      <div class="panel-group hidden" id="exam-opts">
        <label data-i18n="examStructure"></label>
        <div class="exam-counts">
          <span data-i18n="sectionA"></span><input id="count-a" type="number" min="0" max="20" value="8">
          <span data-i18n="sectionB"></span><input id="count-b" type="number" min="0" max="20" value="6">
          <span data-i18n="sectionC"></span><input id="count-c" type="number" min="0" max="20" value="4">
        </div>
        <label for="exam-term" data-i18n="termLabel"></label>
        <select id="exam-term">
          <option value="1" data-i18n="term1"></option>
          <option value="2" data-i18n="term2"></option>
          <option value="3" data-i18n="term3"></option>
        </select>
        <label for="exam-minutes" data-i18n="timeAllowed"></label>
        <input id="exam-minutes" type="number" min="15" max="180" step="5" value="60">
      </div>

      <div class="panel-group">
        <label for="seed" data-i18n="seedLabel"></label>
        <div class="seed-row">
          <input id="seed" type="number" min="1" max="999999">
          <button id="new-seed" class="lang-btn" title="New random seed">🎲</button>
        </div>
        <label class="check-inline"><input id="show-answers" type="checkbox" checked> <span data-i18n="includeAnswers"></span></label>
      </div>

      <button id="generate" class="primary-btn" data-i18n="generateBtn"></button>
      <button id="print" class="primary-btn secondary" data-i18n="printBtn"></button>
    </aside>

    <main id="sheet" class="sheet"></main>
  </div>

  <script src="data.js"></script>
  <script src="gen.js"></script>
  <script src="sheet.js"></script>
</body>
</html>
